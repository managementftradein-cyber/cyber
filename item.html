<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore — Cyberbishop</title><meta name="description" content="Explore Cyberbishop content."><link rel="stylesheet" href="styles.css"><link rel="icon" type="image/png" href="assets/favicon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><div class="grid"></div><div class="orb a"></div><div class="orb b"></div><div class="noise"></div><div class="cursor-glow"></div><div data-site-nav></div><main><section class="section detail-page"><div class="wrap"><a class="back-link" href="catalog.html">← Back to library</a><div id="detail"></div></div></section><section class="section related-section"><div class="wrap"><div class="section-head"><div><div class="section-tag">Keep exploring</div><h2>More to <em>discover.</em></h2></div><a class="text-link" href="catalog.html">View library →</a></div><div id="related" class="media-grid"></div></div></section></main><div class="review-modal"><div class="review-box"><button class="close">Close</button><h3 class="review-modal-title"></h3><div class="review-list"></div><div class="review-form-host"></div></div></div><div data-site-footer></div><script>(async()=>{common();try{const d=await loadData();const p=new URLSearchParams(location.search),type=p.get('type'),id=p.get('id');const item=(type==='book'?d.books:type==='song'?d.songs:d.videos).find(x=>String(x.id)===String(id));if(!item)throw Error('Content not found.');remember(type,id);const category=d.categories.find(c=>String(c.id)===String(item.category_id));const detail=document.getElementById('detail');let visual=item.cover_image_url?`<img src="${esc(safe(item.cover_image_url))}" alt="${esc(item.title)}">`:type==='video'?`<div class="detail-video-placeholder">▶</div>`:`<div class="detail-icon">${type==='song'?'♫':'✦'}</div>`;let action=type==='video'?(item.video_url?`<button class="btn btn-gold video-open" data-video="${esc(safe(item.video_url))}" data-poster="${esc(safe(item.thumbnail_url||''))}">Watch now →</button>`:''):type==='song'?(item.spotify_url?`<a class="btn btn-gold" target="_blank" rel="noopener" href="${esc(safe(item.spotify_url))}">${esc(item.link_label||'Listen on Spotify')} →</a>`:''):(item.purchase_url?`<a class="btn btn-gold" target="_blank" rel="noopener" href="${esc(safe(item.purchase_url))}">${esc(item.link_label||'Get the book')} →</a>`:'');detail.innerHTML=`<div class="detail-grid reveal"><div class="detail-visual">${visual}</div><div class="detail-copy"><span class="pill">${type}</span><div class="section-tag">${esc(category?.title||'Cyberbishop library')}</div><h1>${esc(item.title)}</h1><p>${esc(item.description||'Explore this Cyberbishop release and continue your journey.')}</p><div class="detail-actions">${action}<button class="btn btn-ghost review-open" data-review-type="${esc(type)}" data-review-id="${esc(item.id)}" data-review-title="${esc(item.title)}">★ Reviews</button><button class="btn btn-ghost save-detail">♡ Save</button><button class="btn btn-ghost share-detail">Share ↗</button></div></div></div>`;const sb=detail.querySelector('.save-detail');const saved=getSaved().includes(saveKey(type,id));sb.textContent=saved?'♥ Saved':'♡ Save';sb.onclick=()=>{const now=toggleSaved(type,id);sb.textContent=now?'♥ Saved':'♡ Save'};detail.querySelector('.share-detail').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);detail.querySelector('.share-detail').textContent='Copied ✓'}catch{}};let all=getAllItems().filter(x=>!(x._type===type&&String(x.id)===String(id)));if(category)all=all.filter(x=>String(x.category_id)===String(category.id)).concat(all.filter(x=>String(x.category_id)!==String(category.id)));document.getElementById('related').innerHTML=all.slice(0,3).map(x=>mediaCard(x,x._type)).join('');bindVideos();bindSaves();bindReviews();motion()}catch(e){document.getElementById('detail').innerHTML=`<div class="empty">${esc(e.message)}</div>`}})()</script><div class="video-modal"><div class="video-box"><button class="close">Close</button><video controls playsinline></video></div></div></body></html>
