<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category — Cyberbishop</title><meta name="description" content="Cyberbishop — faith, identity, Christ. Explore books, music, videos and more."><link rel="stylesheet" href="styles.css"><link rel="icon" type="image/png" href="assets/favicon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><div class="grid"></div><div class="orb a"></div><div class="orb b"></div><div class="noise"></div><div data-site-nav></div><main><section class="section" style="padding-top:100px"><div class="wrap"><div id="catTag" class="section-tag">Category</div><h1 id="catTitle" class="display reveal" style="font-size:clamp(48px,8vw,92px);letter-spacing:-.05em;margin:12px 0"></h1><p id="catBlurb" class="reveal" style="max-width:720px;color:var(--muted);font-size:19px"></p><div id="catGrid" class="media-grid" style="margin-top:40px"></div></div></section></main><script>(async()=>{common();try{const d=await loadData();const slug=new URLSearchParams(location.search).get('slug')||'';const c=categoryBySlug(slug);if(!c){document.getElementById('catTitle').textContent='Category not found';motion();return}document.title=`${c.title} — Cyberbishop`;document.getElementById('catTag').textContent=c.tag||'Category';document.getElementById('catTitle').innerHTML=`${esc(c.title)} <span class="gradient">.</span>`;document.getElementById('catBlurb').textContent=c.blurb||'';let arr=[...d.books.filter(x=>x.category_id===c.id).map(x=>[x,'book']),...d.songs.filter(x=>x.category_id===c.id).map(x=>[x,'song']),...d.videos.filter(x=>x.category_id===c.id).map(x=>[x,'video'])];document.getElementById('catGrid').innerHTML=arr.length?arr.map(([x,t])=>mediaCard(x,t)).join(''):`<div class="empty">No published content in this category yet.</div>`;bindVideos();bindSaves();bindReviews();motion()}catch(e){document.getElementById('catGrid').innerHTML=`<div class="empty">${esc(e.message)}</div>`}})()</script><div class="video-modal"><div class="video-box"><button class="close">Close</button><video controls playsinline></video></div></div><div class="review-modal"><div class="review-box"><button class="close">Close</button><h3 class="review-modal-title"></h3><div class="review-list"></div><div class="review-form-host"></div></div></div><div data-site-footer></div></body></html>
