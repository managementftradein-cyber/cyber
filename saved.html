<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved — Cyberbishop</title><meta name="description" content="Your saved Cyberbishop discoveries."><link rel="stylesheet" href="styles.css"><link rel="icon" type="image/png" href="assets/favicon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><div class="grid"></div><div class="orb a"></div><div class="orb b"></div><div class="noise"></div><div data-site-nav></div><main><section class="section" style="padding-top:110px"><div class="wrap"><div class="section-tag">Your shelf</div><h1 class="display reveal" style="font-size:clamp(48px,8vw,92px);letter-spacing:-.05em;margin:12px 0">Your <span class="gradient">saved</span> discoveries.</h1><p class="reveal" style="max-width:700px;color:var(--muted);font-size:19px">Save anything you want to come back to. Your shelf stays on this device.</p><div id="savedGrid" class="media-grid" style="margin-top:40px"></div></div></section></main><div data-site-footer></div><script>(async()=>{common();try{const d=await loadData(),keys=getSaved();const all=getAllItems().filter(x=>keys.includes(saveKey(x._type,x.id)));const g=document.getElementById('savedGrid');g.innerHTML=all.length?all.map(x=>mediaCard(x,x._type)).join(''):'<div class="saved-empty">Nothing saved yet. Explore the library and tap ♡ on something you want to keep.</div>';bindSaves();bindVideos();bindReviews();motion()}catch(e){document.getElementById('savedGrid').innerHTML='<div class="empty">Your saved shelf is unavailable right now.</div>'}})()</script><div class="video-modal"><div class="video-box"><button class="close">Close</button><video controls playsinline></video></div></div><div class="review-modal"><div class="review-box"><button class="close">Close</button><h3 class="review-modal-title"></h3><div class="review-list"></div><div class="review-form-host"></div></div></div></body></html>
