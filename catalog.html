<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog — Cyberbishop</title><meta name="description" content="Cyberbishop — faith, identity, Christ. Explore books, music, videos and more."><link rel="stylesheet" href="styles.css"><link rel="icon" type="image/png" href="assets/favicon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><div class="grid"></div><div class="orb a"></div><div class="orb b"></div><div class="noise"></div><div data-site-nav></div><main><section class="section" style="padding-top:100px"><div class="wrap"><div class="section-tag">Full library</div><h1 class="display reveal" style="font-size:clamp(48px,8vw,92px);letter-spacing:-.05em;margin:12px 0">Everything, <span class="gradient">organized.</span></h1><div class="toolbar reveal"><input id="search" class="search" placeholder="Search titles, descriptions or categories..."><button class="filter active" data-type="all">All</button><button class="filter" data-type="book">Books</button><button class="filter" data-type="song">Music</button><button class="filter" data-type="video">Videos</button></div><div id="categoryChips" class="category-chips"></div><div class="media-grid" id="catalogGrid"></div></div></section></main><script>(async()=>{common();try{const d=await loadData();document.getElementById('categoryChips').innerHTML=d.categories.map(c=>`<a class="category-chip" href="category.html?slug=${encodeURIComponent(categorySlug(c))}">${esc(c.title)}</a>`).join('');let type='all';const grid=document.getElementById('catalogGrid');const draw=()=>{const q=document.getElementById('search').value.toLowerCase();let arr=[];if(type==='all'||type==='book')arr.push(...d.books.map(x=>[x,'book']));if(type==='all'||type==='song')arr.push(...d.songs.map(x=>[x,'song']));if(type==='all'||type==='video')arr.push(...d.videos.map(x=>[x,'video']));arr=arr.filter(([x])=>(x.title+' '+(x.description||'')).toLowerCase().includes(q));grid.innerHTML=arr.length?arr.map(([x,t])=>mediaCard(x,t)).join(''):`<div class="empty">No matching content.</div>`;bindVideos();bindSaves();motion()};document.getElementById('search').oninput=draw;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;draw()});draw()}catch(e){document.getElementById('catalogGrid').innerHTML=`<div class="empty">${esc(e.message)}</div>`}motion()})()</script><div class="video-modal"><div class="video-box"><button class="close">Close</button><video controls playsinline></video></div></div><div class="review-modal"><div class="review-box"><button class="close">Close</button><h3 class="review-modal-title"></h3><div class="review-list"></div><div class="review-form-host"></div></div></div><div data-site-footer></div></body></html>
